name: CI

# Every push and pull request is checked (types, tests, production build, Worker bundle).
# Deployment is done by Cloudflare itself (Workers Builds, connected to this repository):
# after a push to main, the live job waits until the app reports the new version.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Production build
        run: npx vite build
      - name: Demo build
        run: npm run build:demo
      - name: Worker bundle (dry run, no upload)
        run: npx wrangler deploy --dry-run --outdir worker-dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  live:
    name: Live version check
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP_URL: ${{ vars.APP_URL || 'https://shred.shredded.workers.dev' }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Cloudflare to serve this version
        run: |
          expected=$(node -p "require('./package.json').version")
          for i in $(seq 1 40); do
            got=$(curl -fsS "$APP_URL/api/version" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).version)}catch{console.log('')}})" || true)
            if [ "$got" = "$expected" ]; then echo "Live: $APP_URL (v$got)"; exit 0; fi
            echo "Waiting for v$expected (got '$got')"; sleep 15
          done
          echo "::error::$APP_URL/api/version still does not report v$expected. Check the build in Cloudflare > Workers & Pages > shred > Deployments."
          exit 1
